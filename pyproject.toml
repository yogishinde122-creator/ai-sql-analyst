[project]
name = "ai-sql-analyst"
version = "0.1.0"
description = "Bank customer churn analysis in SQL (DuckDB) and an automated accuracy test of AI-written SQL"
readme = "README.md"
authors = [
    { name = "YOGESH  SHINDE", email = "yogishinde122@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "google-genai>=2.34.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
ai-sql-analyst = "ai_sql_analyst:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
